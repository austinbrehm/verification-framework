[project]
name = "verification-framework"
version = "0.1.0"
description = "Python-based software verification framework."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
verification-framework = "verification_framework:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "verification_framework.config.settings"
pythonpath = ["src", "src/verification_framework"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
