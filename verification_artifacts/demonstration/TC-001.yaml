id: TC-001
title: Verify user authentication
acceptance_criteria_ids:
  - AC-001
  - AC-002
  - AC-003
verification_method: demonstration
objective: This test case verifies that the user authentication process works as expected.

preconditions:
  - Application is running
  - Test environment is accessible

steps:
  - id: STEP-001
    type: automated
    action: launch_application
    description: Launch the application.
    expected_result: Application launches successfully

  - id: STEP-002
    type: manual
    action: enter_credentials
    description: Enter test credentials.
    expected_result: Credentials are accepted

  - id: STEP-003
    type: automated
    action: submit_login
    description: Submit the login form.
    expected_result: HTTP response is successful

  - id: STEP-004
    type: verification
    action: verify_dashboard
    description: Verification
    expected_result: Dashboard is displayed
    requires_human_approval: true
