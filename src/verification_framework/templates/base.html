{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verification Framework{% endblock %}</title>
    <script>
        (function() {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (saved === 'light' || (!saved && !prefersDark)) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
    <header>
        <h1 class="site-logo">
            <a href="{% url 'dashboard' %}">
                <img class="logo-light" src="{% static 'light.png' %}" alt="Verification Framework">
                <img class="logo-dark" src="{% static 'dark.png' %}" alt="Verification Framework">
            </a>
        </h1>
        <nav>
            <ul>
                <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                <a href="{% url 'verification' %}">Verification</a>
                <a href="{% url 'admin:index' %}">Admin</a>
                <li>
                    <button type="button" class="theme-toggle" aria-label="Toggle dark mode">
                        <svg class="icon-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="12" cy="12" r="4.5"/>
                            <g stroke-linecap="round">
                                <path d="M12 2.5v2.5"/>
                                <path d="M12 19v2.5"/>
                                <path d="M4.93 4.93l1.77 1.77"/>
                                <path d="M17.3 17.3l1.77 1.77"/>
                                <path d="M2.5 12h2.5"/>
                                <path d="M19 12h2.5"/>
                                <path d="M4.93 19.07l1.77-1.77"/>
                                <path d="M17.3 6.7l1.77-1.77"/>
                            </g>
                        </svg>
                        <svg class="icon-dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>
    <footer>
        <p>&copy; {{ current_year }} Verification Framework</p>
    </footer>
    <script src="{% static 'js/scripts.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</body>
</html>
